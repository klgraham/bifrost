name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  # Isolated crate: clippy + unit tests only. Default features omit fiqa-prep, so
  # nothing downloads BEIR FiQA. USearch 2.26 compiles a C++17 cxx backend plus
  # NumKong C SIMD kernels (no CMake). Force gcc/g++ as compiler and linker:
  # some clang 18 frontends crash on NumKong's dispatch_other.c, and rust-lld
  # invoked via clang-as-cc cannot find libstdc++.
  competitors:
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
      RUSTFLAGS: "-C linker=gcc"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install GCC for USearch / NumKong
        run: sudo apt-get update && sudo apt-get install -y gcc g++
      - run: cargo clippy --manifest-path benchmarks/competitors/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path benchmarks/competitors/Cargo.toml

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --lib
