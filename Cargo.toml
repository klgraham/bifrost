[package]
name = "bifrost"
version = "0.2.0"
edition = "2024"
description = "Bifrost is a compact, mmap-friendly HNSW vector index"
license = "MIT"
readme = "README.md"
rust-version = "1.85"
publish = false
exclude = ["benchmarks/"]

[dependencies]
crc32fast = "1.5"
memmap2 = "0.9"
rand = "0.10"

[[bench]]
name = "distance"
harness = false
