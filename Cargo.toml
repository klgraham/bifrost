[package]
name = "bifrost-index"
version = "0.2.1"
edition = "2024"
description = "Bifrost is a compact, mmap-friendly HNSW vector index"
license = "MIT"
readme = "README.md"
repository = "https://github.com/klgraham/bifrost"
documentation = "https://docs.rs/bifrost-index"
rust-version = "1.87"
exclude = ["benchmarks/"]
keywords = ["hnsw", "ann", "vector", "nearest-neighbor"]
categories = ["algorithms", "data-structures"]

[lib]
name = "bifrost"

[dependencies]
crc32fast = "1.5"
memmap2 = "0.9"
rand = "0.10"

[[bench]]
name = "distance"
harness = false
