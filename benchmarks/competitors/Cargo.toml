[package]
name = "bifrost-competitor-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.85"
default-run = "bifrost-competitor-benchmarks"

[features]
fiqa-prep = ["dep:md5", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:zip"]

[dependencies]
bifrost = { path = "../.." }
hnsw_rs_upstream = { package = "hnsw_rs", version = "=0.3.4" }
md5 = { version = "=0.8.1", optional = true }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"], optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.150", optional = true }
usearch = "=2.26.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"], optional = true }

[[bin]]
name = "prepare-fiqa"
path = "src/bin/prepare-fiqa.rs"
required-features = ["fiqa-prep"]
